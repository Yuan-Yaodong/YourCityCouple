<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Share Preview Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Noto Serif SC', serif;
    }
    .canvas-container {
      position: relative;
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #DC143C 0%, #8B0000 50%, #2D0A0A 100%);
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    /* Gold foil texture overlay */
    .canvas-container::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,215,0,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255,215,0,0.1) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,180,0,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    /* Decorative circles */
    .circle-1 {
      position: absolute;
      width: 400px;
      height: 400px;
      border: 2px solid rgba(255,215,0,0.2);
      border-radius: 50%;
      top: -100px;
      right: -100px;
    }
    .circle-2 {
      position: absolute;
      width: 300px;
      height: 300px;
      border: 2px solid rgba(255,215,0,0.15);
      border-radius: 50%;
      bottom: -80px;
      left: -80px;
    }
    /* Main content */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 100%;
    }
    /* Year badge */
    .year {
      font-size: 180px;
      font-weight: 900;
      color: #FFD700;
      text-shadow:
        0 0 40px rgba(255,215,0,0.5),
        0 4px 0 #B8860B,
        0 8px 20px rgba(0,0,0,0.3);
      letter-spacing: 20px;
      line-height: 1;
      font-family: 'Noto Serif SC', serif;
      opacity: 0.95;
    }
    /* Main title */
    .title {
      font-size: 72px;
      font-weight: 700;
      color: #fff;
      margin-top: 20px;
      letter-spacing: 30px;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      font-family: 'Noto Serif SC', serif;
    }
    /* Subtitle */
    .subtitle {
      font-size: 28px;
      color: rgba(255,255,255,0.8);
      margin-top: 30px;
      letter-spacing: 15px;
      font-weight: 300;
      font-family: 'Noto Serif SC', serif;
    }
    /* Decorative elements */
    .coin {
      position: absolute;
      font-size: 60px;
      opacity: 0.9;
    }
    .coin-1 { top: 80px; left: 100px; }
    .coin-2 { bottom: 100px; right: 120px; }
    .coin-3 { top: 120px; right: 180px; font-size: 40px; }
    /* Bottom tagline */
    .tagline {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 20px;
      color: rgba(255,215,0,0.7);
      letter-spacing: 8px;
    }
    /* Border frame */
    .frame {
      position: absolute;
      top: 20px; left: 20px; right: 20px; bottom: 20px;
      border: 3px solid rgba(255,215,0,0.4);
      pointer-events: none;
    }
    .frame::before, .frame::after {
      content: '❖';
      position: absolute;
      color: #FFD700;
      font-size: 30px;
    }
    .frame::before { top: -15px; left: 50%; transform: translateX(-50%); }
    .frame::after { bottom: -15px; left: 50%; transform: translateX(-50%); }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="canvas-container" id="canvas">
    <div class="circle-1"></div>
    <div class="circle-2"></div>
    <div class="frame"></div>

    <span class="coin coin-1">🧧</span>
    <span class="coin coin-2">🧧</span>
    <span class="coin coin-3">✨</span>

    <div class="content">
      <div class="year">2026</div>
      <div class="title">新年旺城</div>
      <div class="subtitle">测测你的开年旅游地</div>
    </div>

    <div class="tagline">14题 × MBTI × 五行 × 生肖</div>
  </div>
</body>
</html>
