<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026新年旺旺 - 测测你的开年旅游地</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 动态背景 -->
  <div class="bg-layer">
    <canvas id="particles-canvas"></canvas>
    <div class="gradient-orb orb-1"></div>
    <div class="gradient-orb orb-2"></div>
    <div class="gradient-orb orb-3"></div>
    <div class="noise-overlay"></div>
    <div class="light-rays"></div>
  </div>

  <!-- 飘落的花瓣/金币 -->
  <div class="falling-elements" id="falling-elements"></div>

  <div id="app">
    <!-- 引导页 -->
    <div id="page-index" class="page active">
      <div class="content-wrapper">
        <!-- 主标题区域 -->
        <div class="hero-section">
          <div class="year-badge">2026</div>
          <h1 class="main-title">
            <span class="title-char" style="--i:0">新</span>
            <span class="title-char" style="--i:1">年</span>
            <span class="title-char" style="--i:2">旺</span>
            <span class="title-char" style="--i:3">旺</span>
          </h1>
          <div class="title-glow"></div>
        </div>

        <p class="subtitle">测测你的开年旅游地</p>

        <!-- 吉祥话 -->
        <div class="fortune-cards">
          <div class="fortune-card" style="--i:0">
            <span class="fortune-icon">💰</span>
            <span class="fortune-text">财源滚滚</span>
          </div>
          <div class="fortune-card" style="--i:1">
            <span class="fortune-icon">🎯</span>
            <span class="fortune-text">步步高升</span>
          </div>
          <div class="fortune-card" style="--i:2">
            <span class="fortune-icon">❤️</span>
            <span class="fortune-text">万事如意</span>
          </div>
        </div>

        <!-- 开始按钮 -->
        <button class="btn-start" onclick="startTest()">
          <span class="btn-text">开始测试</span>
          <span class="btn-shine"></span>
          <span class="btn-particles"></span>
        </button>

        <div class="tips">10道题 · 测出你的福气城市</div>
      </div>
    </div>

    <!-- 问题页 -->
    <div id="page-quiz" class="page">
      <div class="quiz-container">
        <!-- 进度条 -->
        <div class="progress-section">
          <div class="progress-track">
            <div id="progress-inner" class="progress-fill"></div>
            <div class="progress-glow"></div>
          </div>
          <div class="progress-info">
            <span id="progress-text" class="progress-text">1 / 6</span>
            <span class="progress-dots">
              <!-- 进度点由JS动态生成 -->
            </span>
          </div>
        </div>

        <!-- 问题卡片 -->
        <div class="question-card" id="question-card">
          <div class="card-inner">
            <div class="question-badge">
              <span class="badge-icon">✨</span>
              <span id="question-num">第1题</span>
            </div>
            <h2 id="question-text" class="question-text"></h2>
            <div id="question-source" class="question-source" style="display: none;"></div>

            <div id="options-list" class="options-grid">
              <!-- 选项动态生成 -->
            </div>
          </div>
        </div>

        <!-- 底部装饰 -->
        <div class="quiz-footer">
          <div class="footer-pattern"></div>
        </div>
      </div>
    </div>

    <!-- 结果页 -->
    <div id="page-result" class="page">
      <div class="result-container">
        <!-- 庆祝动效 -->
        <div class="celebration" id="celebration"></div>

        <!-- 结果头部 -->
        <div class="result-header">
          <div class="result-badge">你的开年旺城</div>
          <div class="city-showcase">
            <div class="city-emoji" id="result-emoji"></div>
            <div class="city-name" id="result-city"></div>
            <div class="city-glow"></div>
          </div>
        </div>

        <!-- 城市卡片 -->
        <div class="city-show-card">
          <div class="city-desc" id="city-desc"></div>

          <div class="tags-row" id="tags"></div>

          <div class="city-detail" id="city-detail"></div>

          <div id="core-summary" class="core-summary" style="display: none;"></div>

          <div class="details-toggle-wrap">
            <button id="toggle-details" class="btn-toggle" onclick="toggleExtendedDetails()">展开详细解析</button>
          </div>

          <div id="extended-details" class="extended-details" style="display: none;">

          <!-- 分析文案 -->
          <div id="analysis-section" class="analysis-block" style="display: none;">
            <div class="analysis-header">
              <span class="analysis-icon">🔮</span>
              <span>为什么适合你</span>
            </div>
            <div id="why-fit" class="analysis-list"></div>
            <div id="analysis-summary" class="analysis-summary"></div>
          </div>

          <div id="mbti-display" class="mbti-block" style="display: none;"></div>

          <div id="runnerup-display" class="runnerup-block" style="display: none;"></div>

          <div id="compare-display" class="compare-block" style="display: none;"></div>

          <div id="action-tips-display" class="action-tips-block" style="display: none;"></div>

          <div id="daily-quote-display" class="daily-quote-block" style="display: none;"></div>

          <div id="ritual-display" class="ritual-block" style="display: none;"></div>

          <!-- 用户答案回顾 -->
          <div class="answers-toggle">
            <button id="toggle-answers" class="btn-toggle" onclick="toggleAnswers()">查看我的答案</button>
          </div>
          <div id="answers-section" class="answers-section">
            <div id="user-answers-list"></div>
          </div>

          <!-- 专属称号 -->
          <div class="title-section" id="title-display"></div>

          <!-- 五行属性 -->
          <div class="five-element-section" id="five-element-display"></div>

          <!-- 幸运元素 -->
          <div class="lucky-section" id="lucky-display"></div>
          </div>
        </div>

        <!-- 按钮区域 -->
        <div class="result-actions">
          <button class="btn-share-action" onclick="shareResult()">
            <span class="btn-icon">📲</span>
            <span>微信分享</span>
          </button>
          <button class="btn-copy" onclick="copyResult()">
            <span class="btn-icon">📝</span>
            <span>复制长文案</span>
          </button>
          <button class="btn-retry" onclick="restartTest()">
            <span class="btn-icon">🔄</span>
            <span>再测一次</span>
          </button>
        </div>

        <!-- 底部祝福 -->
        <div class="result-footer">
          <div class="footer-text">🧧 新年行大运 🧧</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 答题即时反馈 -->
  <div id="quiz-toast" class="quiz-toast"></div>

  <!-- 好运签彩蛋弹窗 -->
  <div id="lucky-modal" class="lucky-modal" style="display: none;">
    <div class="lucky-modal-card">
      <div class="lucky-modal-title">🎴 好运签</div>
      <div id="lucky-modal-content" class="lucky-modal-content"></div>
      <button class="btn-toggle" onclick="closeLuckyModal()">收下好运</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // 粒子系统
    class ParticleSystem {
      constructor() {
        this.canvas = document.getElementById('particles-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.animate();
      }

      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }

      createParticle() {
        return {
          x: Math.random() * this.canvas.width,
          y: -10,
          size: Math.random() * 4 + 1,
          speedY: Math.random() * 1 + 0.5,
          speedX: Math.random() * 2 - 1,
          opacity: Math.random() * 0.8 + 0.2,
          hue: Math.random() > 0.5 ? 45 : 30 // 金色或橙色
        };
      }

      animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // 添加新粒子
        if (this.particles.length < 100 && Math.random() > 0.9) {
          this.particles.push(this.createParticle());
        }

        // 更新和绘制粒子
        this.particles.forEach((p, i) => {
          p.y += p.speedY;
          p.x += p.speedX;

          // 绘制发光粒子
          const gradient = this.ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3);
          gradient.addColorStop(0, `hsla(${p.hue}, 100%, 70%, ${p.opacity})`);
          gradient.addColorStop(0.5, `hsla(${p.hue}, 100%, 50%, ${p.opacity * 0.5})`);
          gradient.addColorStop(1, 'transparent');

          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.size * 3, 0, Math.PI * 2);
          this.ctx.fillStyle = gradient;
          this.ctx.fill();

          // 移除超出屏幕的粒子
          if (p.y > this.canvas.height + 10) {
            this.particles.splice(i, 1);
          }
        });

        requestAnimationFrame(() => this.animate());
      }
    }

    // 飘落元素
    class FallingElements {
      constructor() {
        this.container = document.getElementById('falling-elements');
        this.elements = ['🧧', '🎊', '🏮', '✨', '💫', '🪙', '🐲', '🪄'];
        this.createElements();
      }

      createElements() {
        for (let i = 0; i < 20; i++) {
          const el = document.createElement('div');
          el.className = 'falling-item';
          el.textContent = this.elements[Math.floor(Math.random() * this.elements.length)];
          el.style.left = Math.random() * 100 + '%';
          el.style.animationDelay = Math.random() * 5 + 's';
          el.style.animationDuration = (Math.random() * 3 + 5) + 's';
          el.style.setProperty('--drift', (Math.random() * 100 - 50) + 'px');
          this.container.appendChild(el);
        }
      }
    }

    // 庆祝烟花
    function createCelebration() {
      const container = document.getElementById('celebration');
      container.innerHTML = '';

      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'confetti';
        particle.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
        particle.style.setProperty('--y', (Math.random() * -200 - 50) + 'px');
        particle.style.setProperty('--r', Math.random() * 360 + 'deg');
        particle.style.setProperty('--delay', Math.random() * 0.5 + 's');
        particle.style.setProperty('--hue', Math.random() > 0.5 ? '45' : '30');
        container.appendChild(particle);
      }
    }

    // 页面加载完成后初始化
    window.addEventListener('load', () => {
      new ParticleSystem();
      new FallingElements();
    });
  </script>
</body>
</html>
