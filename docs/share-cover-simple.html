<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026新年旺城</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #FF6B6B 100%);
      font-family: "Noto Serif SC", "PingFang SC", "Microsoft YaHei", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }
    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    /* 金色光晕 */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,215,0,0.3) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* 装饰圆环 */
    .ring {
      position: absolute;
      border: 2px solid rgba(255,215,0,0.2);
      border-radius: 50%;
    }
    .ring-1 { width: 500px; height: 500px; }
    .ring-2 { width: 400px; height: 400px; }
    .ring-3 { width: 300px; height: 300px; }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .year {
      font-size: 140px;
      font-weight: 900;
      color: #FFD700;
      text-shadow: 0 4px 0 #B8860B, 0 0 40px rgba(255,215,0,0.5);
      letter-spacing: 10px;
      line-height: 1;
    }

    .title {
      font-size: 64px;
      font-weight: 700;
      color: #fff;
      margin-top: 20px;
      letter-spacing: 20px;
    }

    .subtitle {
      font-size: 28px;
      color: rgba(255,255,255,0.85);
      margin-top: 25px;
      letter-spacing: 8px;
    }

    .footer {
      position: absolute;
      bottom: 45px;
      font-size: 18px;
      color: rgba(255,215,0,0.7);
      letter-spacing: 4px;
    }

    /* 角落装饰 */
    .corner {
      position: absolute;
      font-size: 48px;
      opacity: 0.8;
    }
    .corner-tl { top: 30px; left: 40px; }
    .corner-tr { top: 30px; right: 40px; }
    .corner-bl { bottom: 30px; left: 40px; }
    .corner-br { bottom: 30px; right: 40px; }
  </style>
</head>
<body>
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>

  <span class="corner corner-tl">🧧</span>
  <span class="corner corner-tr">🧧</span>
  <span class="corner corner-bl">✨</span>
  <span class="corner corner-br">✨</span>

  <div class="content">
    <div class="year">2026</div>
    <div class="title">新年旺城</div>
    <div class="subtitle">测测你的开年旅游地</div>
  </div>

  <div class="footer">14题 × MBTI × 五行 × 生肖</div>
</body>
</html>
