<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auspicious Fortune - Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Noto Serif SC', serif;
        }
        #canvas-container {
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(255, 215, 0, 0.15);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // Parameters
        let seed = 2026;
        let particles = [];
        let particleCount = 3000;
        let noiseScale = 0.003;
        let flowStrength = 0.8;

        // Colors - Auspicious palette
        const colors = {
            deepRed: '#8B0000',
            vermillion: '#DC143C',
            gold: '#FFD700',
            paleGold: '#F5DEB3',
            darkGold: '#B8860B',
            warmAmber: '#FFBF00'
        };

        function setup() {
            let canvas = createCanvas(1200, 630);
            canvas.parent('canvas-container');
            initializeSystem();
            noLoop(); // Static image
        }

        function initializeSystem() {
            randomSeed(seed);
            noiseSeed(seed);

            // Create particles
            particles = [];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new FortuneParticle());
            }
        }

        function draw() {
            // Deep red gradient background
            drawBackground();

            // Draw fortune circle mandala
            drawFortuneCircle();

            // Draw flowing gold particles
            drawParticles();

            // Add text overlay
            drawText();
        }

        function drawBackground() {
            // Gradient from deep red to dark
            for (let y = 0; y < height; y++) {
                let inter = map(y, 0, height, 0, 1);
                let c = lerpColor(
                    color(45, 10, 10),
                    color(139, 0, 0),
                    inter
                );
                stroke(c);
                line(0, y, width, y);
            }

            // Add subtle gold glow in center
            let centerX = width / 2;
            let centerY = height / 2;
            noStroke();
            for (let r = 400; r > 0; r -= 10) {
                let alpha = map(r, 0, 400, 30, 0);
                fill(255, 215, 0, alpha);
                ellipse(centerX, centerY, r * 2);
            }
        }

        function drawFortuneCircle() {
            let cx = width / 2;
            let cy = height / 2;
            let baseRadius = 200;

            push();
            translate(cx, cy);

            // Outer decorative ring
            noFill();
            stroke(255, 215, 0, 40);
            strokeWeight(2);
            ellipse(0, 0, baseRadius * 2.2);

            // Inner rings with pattern
            for (let r = 0; r < 8; r++) {
                let radius = baseRadius * (0.3 + r * 0.1);
                stroke(255, 215, 0, 20 + r * 5);
                ellipse(0, 0, radius * 2);
            }

            // Fortune character placeholder (stylized circle)
            noStroke();
            fill(255, 215, 0, 15);
            ellipse(0, 0, baseRadius * 1.4);

            pop();

            // Decorative corner elements
            drawCornerDecorations();
        }

        function drawCornerDecorations() {
            // Gold dots in corners - subtle framing
            fill(255, 215, 0, 30);
            noStroke();

            let corners = [
                [60, 40],
                [width - 60, 40],
                [60, height - 40],
                [width - 60, height - 40]
            ];

            for (let corner of corners) {
                // Main dot
                ellipse(corner[0], corner[1], 8, 8);

                // Surrounding smaller dots
                for (let i = 0; i < 6; i++) {
                    let angle = TWO_PI / 6 * i;
                    let x = corner[0] + cos(angle) * 20;
                    let y = corner[1] + sin(angle) * 20;
                    fill(255, 215, 0, 15);
                    ellipse(x, y, 4, 4);
                }
            }
        }

        function drawParticles() {
            // Draw flowing gold particles
            for (let p of particles) {
                p.update();
                p.display();
            }
        }

        function drawText() {
            push();

            // Main title - 2026
            textAlign(CENTER, CENTER);
            fill(255, 215, 0);
            textSize(140);
            textStyle(BOLD);
            text('2026', width / 2, height / 2 - 20);

            // Subtitle - 新年旺城
            fill(255, 255, 255, 230);
            textSize(48);
            textStyle(NORMAL);
            text('新年旺城', width / 2, height / 2 + 80);

            // Tagline
            fill(255, 215, 0, 180);
            textSize(20);
            text('测测你的开年旅游地', width / 2, height - 50);

            // Decorative symbols
            textSize(36);
            text('🧧', width / 2 - 180, height / 2);
            text('🧧', width / 2 + 180, height / 2);

            pop();
        }

        // Particle class
        class FortuneParticle {
            constructor() {
                this.reset();
            }

            reset() {
                // Start from edges or random
                if (random() < 0.5) {
                    this.pos = createVector(random(width), random() < 0.5 ? 0 : height);
                } else {
                    this.pos = createVector(random() < 0.5 ? 0 : width, random(height));
                }
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.maxSpeed = random(1, 3);
                this.prevPos = this.pos.copy();

                // Color based on initial position
                let distFromCenter = dist(this.pos.x, this.pos.y, width/2, height/2);
                if (distFromCenter < 150) {
                    this.color = color(255, 215, 0); // Gold in center
                } else if (distFromCenter < 250) {
                    this.color = color(255, 191, 0); // Warm amber
                } else {
                    this.color = color(245, 222, 179); // Pale gold at edges
                }
                this.color.setAlpha(random(100, 200));
            }

            update() {
                // Flow field based on Perlin noise
                let n = noise(this.pos.x * noiseScale, this.pos.y * noiseScale);
                let angle = n * TWO_PI * 2;

                let force = p5.Vector.fromAngle(angle);
                force.mult(flowStrength);

                this.acc.add(force);
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                // Attract toward center slightly
                let centerForce = createVector(width/2 - this.pos.x, height/2 - this.pos.y);
                centerForce.mult(0.001);
                this.acc.add(centerForce);

                // Wrap around or reset
                if (this.pos.x < 0 || this.pos.x > width ||
                    this.pos.y < 0 || this.pos.y > height) {
                    this.reset();
                }
            }

            display() {
                stroke(this.color);
                strokeWeight(2);
                line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
                this.prevPos = this.pos.copy();
            }
        }

        // Add click to regenerate
        function mousePressed() {
            seed = floor(random(10000));
            initializeSystem();
            redraw();
        }
    </script>
</body>
</html>
